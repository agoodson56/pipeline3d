<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline3D — Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0e1117;
            color: #e4e4e7;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .offline-card {
            max-width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
        }

        .offline-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: #71717a;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .retry-btn {
            background: linear-gradient(135deg, #D4A017, #b8860b);
            color: #000;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .retry-btn:hover {
            transform: scale(1.05);
        }

        .status {
            margin-top: 16px;
            font-size: 12px;
            color: #52525b;
        }
    </style>
</head>

<body>
    <div class="offline-card">
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        <p>Pipeline3D needs an internet connection to sync your data. Your cached data is still available in read-only
            mode.</p>
        <button class="retry-btn" onclick="window.location.reload()">🔄 Try Again</button>
        <div class="status">Pipeline3D will automatically reconnect when your network is back.</div>
    </div>
    <script>
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>

</html>
